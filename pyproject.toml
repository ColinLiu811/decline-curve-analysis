[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dca"
version = "0.1.0"
description = "Arps decline curve analysis: fit, forecast and estimate EUR from well production data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dca = "dca.cli:main"

[tool.setuptools.packages.find]
include = ["dca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
